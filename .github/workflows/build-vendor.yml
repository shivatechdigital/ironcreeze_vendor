name: Build Vendor App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/build-vendor.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/build-vendor.yml'

permissions:
  contents: read

jobs:
  android:
    name: Vendor Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Clean build files
        run: flutter clean
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vendor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: Vendor iOS Build
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Clean build files
        run: flutter clean
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: vendor-unsigned-ios-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

  deploy-functions:
    name: Deploy Firebase Functions
    if: github.event_name != 'pull_request' && secrets.FIREBASE_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Authenticate with Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy notification and account deletion functions
        run: npx firebase-tools@latest deploy --project ironcreezeadmin --only functions:sendCustomerNotification,functions:deleteAccount